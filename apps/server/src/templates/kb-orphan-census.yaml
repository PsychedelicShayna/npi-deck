name: kb-orphan-census
description: Every Monday, list the KB notes nothing links to in one inbox item for review. Honours .kbignore; never edits the KB.
trigger:
  - cron: "0 9 * * 1"
concurrency: skip
budget:
  max_duration_secs: 120
  max_llm_cost_usd: 0
tags: [kb, maintenance, weekly]

# Findings go to the inbox, not the KB: the census only reports, you decide
# per note whether to link it from a hub, list it in .kbignore, or delete it.
# A report note written into the KB would itself be an orphan in next week's
# census. While an earlier report is still unprocessed, no new one is filed.

steps:
  - id: census
    type: deck
    action: kb_orphan_census
    limit: 200

  - id: open_reports
    type: deck
    when: steps.census.json.orphanCount > 0
    action: list_inbox
    kind: investigation

  - id: report
    type: transform
    when: steps.census.json.orphanCount > 0
    body: |
      const open = (steps.open_reports.json || []).some((i) => i.source === "routine:kb-orphan-census");
      if (open) return null;
      const c = steps.census.json;
      const stem = (p) => p.split("/").pop().replace(/\.md$/i, "").toLowerCase();
      const line = (o) => "- `" + o.path + "`" + (o.title.toLowerCase() !== stem(o.path) ? " - " + o.title : "");
      const isolated = c.orphans.filter((o) => o.outbound === 0);
      const linking = c.orphans.filter((o) => o.outbound > 0);
      const out = [
        c.orphanCount + " of " + c.notes + " notes under `" + c.root + "` have no backlinks from another note.",
        "",
        "For each one: link it from a hub or a related note, list it in `.kbignore`, or delete it.",
      ];
      if (isolated.length > 0) out.push("", "## Isolated: no links in or out (" + isolated.length + (c.truncated ? " listed" : "") + ")", "", ...isolated.map(line));
      if (linking.length > 0) out.push("", "## Links out, but nothing links in (" + linking.length + (c.truncated ? " listed" : "") + ")", "", ...linking.map(line));
      if (c.truncated) out.push("", "_Listing the first " + c.orphans.length + " of " + c.orphanCount + " orphans by path; raise `limit` on the census step to see more._");
      if (c.unresolvedLinks > 0) out.push("", c.unresolvedLinks + " wikilinks resolve to no note.");
      return out.join("\n");

  - id: file_report
    type: deck
    when: typeof steps.report.json === "string"
    action: create_inbox_item
    kind: investigation
    title: "KB orphan census - {{ run.date }}: {{ steps.census.json.orphanCount }} orphan note(s)"
    source: routine:kb-orphan-census
    body: |
      {{ steps.report.json }}

      ---
      _Generated by routine `kb-orphan-census` run {{ run.id }}_
